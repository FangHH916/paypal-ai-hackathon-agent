name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: offline           # CI never calls a real model, speech service or PayPal
      PAYPAL_MODE: simulator
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r tests/requirements.txt
      - run: python -m unittest discover tests -v
      - name: Safety checks (no unsigned execution, every attack blocked, every scripted case passes)
        run: python eval/run_eval.py --require-all
      - name: Transaction contract fault injection
        run: python eval/run_contract_eval.py
  browser:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: offline
      PAYPAL_MODE: simulator
      E2E_CHANNEL: bundled
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r tests/requirements.txt -r qa/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python qa/e2e_demo.py
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t star-check .
