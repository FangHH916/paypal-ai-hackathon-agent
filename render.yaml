# One-click deploy on Render (https://render.com): New + > Blueprint > pick this repository.
# Out of the box this runs keyless: the PayPal simulator and the offline rule engine, all labelled in the UI.
# To use the real PayPal sandbox: set PAYPAL_MODE=sandbox and the PAYPAL_* secrets in the dashboard.
# To use an AI model: set LLM_PROVIDER=openai_compat and the LLM_* values in the dashboard.
# Secrets marked "sync: false" are typed into the Render dashboard, never committed.
services:
  - type: web
    name: star-family-payments
    runtime: python
    region: oregon
    plan: free                      # free instances sleep after ~15 min idle and wipe the disk; pick "starter" for judging week
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.server:app --host 0.0.0.0 --port $PORT --no-proxy-headers
    healthCheckPath: /api/health
    autoDeploy: true                # every push to main redeploys
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: PAYPAL_MODE            # set in the dashboard: sandbox, or empty for the keyless simulator. Not a fixed
        sync: false                 # value here, so a Blueprint sync never resets the dashboard's choice
      - key: PUBLIC_DEMO            # every browser gets its own demo customer; per-device rate limits
        value: "1"
      - key: SIGNING_SECRET
        generateValue: true
      # TRUSTED_PROXY_HOPS stays unset until Render's X-Forwarded-For chain has been checked: see docs/SECURITY.md
      - key: WALLET_CURRENCY
        value: USD
      - key: SCAM_HOTLINE_COUNTRY
        value: US
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_SANDBOX_RECEIVERS
        sync: false
      - key: LLM_PROVIDER           # openai_compat, or leave empty for the offline rule engine
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: ASR_PROVIDER           # browser (default), openai_compat, or the cloud speech option in .env.example
        sync: false
      - key: ASR_BASE_URL
        sync: false
      - key: ASR_API_KEY
        sync: false
      - key: ASR_MODEL
        sync: false
      - key: TENCENTCLOUD_SECRET_ID   # only for that cloud's speech recognition; see .env.example
        sync: false
      - key: TENCENTCLOUD_SECRET_KEY
        sync: false
