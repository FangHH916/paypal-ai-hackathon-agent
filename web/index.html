<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fa">
  <meta name="style-nonce" content="__STYLE_NONCE__">
  <meta name="description" content="Voice payments for seniors and their families, with fixed checks and a device signature before money can move. A prototype designed for the PayPal sandbox.">
  <title>Star Family Payments</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/gloock-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main" id="skip">Skip to main content</a>
  <div id="app"><p class="boot" role="status">Opening Star…</p></div>
  <noscript><p class="boot">Please turn on JavaScript and refresh this page to use the demo. Mrs. Lee and her family are fictional. Designed for the PayPal sandbox; not affiliated with PayPal.</p></noscript>
  <aside class="trace" id="trace" aria-label="Agent trace" aria-hidden="true">
    <header><h2>Agent trace</h2><button type="button" class="btn secondary small" id="trace-close">Close</button></header>
    <p class="muted small">Thought, action, observation, evidence, rules, signature, execution. Every step is also written to a hash-chained audit log.</p>
    <div class="tlist" id="tlist"></div>
  </aside>
  <dialog class="confirm" id="confirm" aria-labelledby="c-title"></dialog>
  <dialog class="side" id="detail" aria-labelledby="d-title"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="sr-live" class="sr" aria-live="polite" aria-atomic="true"></div>
  <div id="sr-alert" class="sr" aria-live="assertive" aria-atomic="true"></div>
</body>
</html>
